name: Build AutoVault Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI with 1 click

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release --split-per-abi=false

      - name: 🏷️ Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AutoVault-v1.0.apk

      - name: 📤 Upload APK Artifact (Downloadable for WhatsApp)
        uses: actions/upload-artifact@v4
        with:
          name: AutoVault-Android-APK
          path: build/app/outputs/flutter-apk/AutoVault-v1.0.apk
          retention-days: 30
